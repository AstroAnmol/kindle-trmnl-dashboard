# ==============================================================================
# Kindle TRMNL Dashboard Configuration
# ==============================================================================
# You can edit this file directly over USB mass storage.
# Both Windows (CRLF) and Unix (LF) line endings are handled safely.

# URL serving the raw PNG dashboard image
DASHBOARD_URL="http://10.0.0.219:5055/api/display/image"

# Refresh interval in seconds (900 = 15 minutes, 300 = 5 minutes)
INTERVAL=900

# Full screen clear (eips -c) every N cycles to prevent e-ink ghosting
FULL_REFRESH_EVERY=12

# Minimum battery percentage to run the loop (prevents deep discharge)
LOW_BATTERY_THRESHOLD=10

# Hardware escape hatch: 1 = touching screen or pressing power button restores Kindle UI
ENABLE_ESCAPE_HATCH=1
